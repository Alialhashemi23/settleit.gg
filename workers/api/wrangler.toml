name = "settleit-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [{ name = "ROOMS", class_name = "RoomDO" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[[d1_databases]]
binding = "DB"
database_name = "settleit"
database_id = "replace-with-real-id"
migrations_dir = "migrations"

[triggers]
crons = ["*/15 * * * *"]

[vars]
ENVIRONMENT = "development"
ADMIN_GITHUB_LOGINS = ""
