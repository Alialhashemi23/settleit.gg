services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      FRONTEND_ORIGIN: "http://localhost:5173"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:3000"
    environment:
      VITE_BACKEND_URL: "http://localhost:3001"
    depends_on:
      - backend
    restart: unless-stopped
